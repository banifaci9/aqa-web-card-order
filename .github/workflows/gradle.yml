name: Gradle Selenium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Start SUT
        run: java -jar ./artifacts/app-order.jar &
      - name: Run Selenium tests
        run: ./gradlew test --info
